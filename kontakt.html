<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Holzarbeiten — Kontakt</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          Holzarbeiten <span style="color:var(--brand2);">Max Mustermann</span>
        </div>
      </div>
      <nav class="nav-links" aria-label="Navigation">
        <a href="index.html">Start</a>
        <a href="leistungen.html">Leistungen</a>
        <a href="referenzen.html">Referenzen</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section" style="padding-top:28px">
      <h2>Kontakt / Anfrage</h2>
      <p style="color:var(--muted);margin:0 0 18px;">
        Schreib mir kurz, was du vorhast — ich melde mich in Kürze zurück. (In Version 1 wird nur eine Erfolgsmeldung angezeigt.)
      </p>

      <div class="panel" style="max-width:760px;">
        <form id="kontaktForm" class="form">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>

          <div class="field">
            <label for="email">E-Mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="thema">Thema</label>
            <select id="thema" name="thema" required>
              <option value="" selected disabled>Bitte auswählen</option>
              <option value="moebel">Möbel / Maßanfertigung</option>
              <option value="reparatur">Reparatur</option>
              <option value="restaurierung">Restaurierung</option>
              <option value="innenausbau">Innenausbau</option>
              <option value="sonstiges">Sonstiges</option>
            </select>
          </div>

          <div class="field">
            <label for="nachricht">Nachricht</label>
            <textarea id="nachricht" name="nachricht" required></textarea>
          </div>

          <div class="checkbox-row">
            <input id="consent" name="consent" type="checkbox" required />
            <label for="consent" style="margin:0;">
              Ich bin einverstanden, dass du mir antwortest.
            </label>
          </div>

          <button class="btn" type="submit">Anfrage senden</button>
          <div id="kontaktNotice" class="notice" role="status" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>© <span id="year"></span> Holzarbeiten Max Mustermann</div>
      <div class="small-links">
        <a href="index.html">Start</a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

  <script src="app.js"></script>
</body>
</html>
